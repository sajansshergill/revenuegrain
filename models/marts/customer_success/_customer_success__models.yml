version: 2

models:
  - name: fct_account_health
    description: Composite account health score (0-100). Grain account x month.
    columns:
      - name: health_key
        tests: [not_null, unique]
      - name: health_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: month_start
        tests: [not_null]

  - name: fct_feature_adoption
    description: Per-account feature usage summary. Grain account x feature.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - account_id
            - feature_key
    columns:
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: feature_key
        tests: [not_null]
      - name: event_count
        tests: [positive_value]
